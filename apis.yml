aid: archera
name: Archera
description: >-
  Archera is a cloud financial operations (FinOps) platform that helps
  organizations reduce cloud spend by 20-30% through intelligent commitment
  management and insured, short-term cloud commitments across AWS, Azure, and
  Google Cloud. Its Guaranteed Commitments (Guaranteed Savings Plans, Guaranteed
  Reserved Instances, and Guaranteed Committed Use Discounts) provide flexible
  terms as short as 30 days with risk protection for unused capacity. The
  Archera Public API exposes commitment plans, commitments, exchanges, metrics,
  resources, orgs, and uploads over a REST v1 interface authenticated with an
  API key or OAuth 2.0 (Authorization Code + PKCE), and Archera operates a
  hosted remote MCP server so AI assistants can query cloud cost data and
  optimization recommendations directly. A Partner API supports onboarding
  customers and creating marketplace offers via AWS CPPO, Microsoft MPO, and
  Google MCPO.
