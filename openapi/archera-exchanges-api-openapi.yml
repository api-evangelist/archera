        lease_menu_item_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Lease menu item attached to the purchase side, or null for native purchases.
        quantity:
          type: integer
          description: Quantity of the Azure reservation to purchase.
        offer:
          description: Azure reservation offer being purchased.
